# @package _global_
#
# Diffusion Policy (UNet backbone) with goal-image conditioning. Isolates the
# UNet-capacity question: DP-canonical optimizer + dataloader settings, but
# keeps il_lib's small ``down_dims=[64, 128]`` UNet instead of DP's
# ``[512, 1024, 2048]``.
#
# Hypothesis tested:
#   Is the UNet capacity bump (40-50x more channels at the deepest layer) the
#   dominant change in ``diffusion_goal_rgb_unet.yaml``, or are the optimizer
#   changes (lr/wd/bs/optimizer) doing most of the work? Compare to:
#     * ``diffusion_goal_rgb_unet.yaml``         (DP optimizer + DP capacity)
#     * ``diffusion_goal_rgb_unet_il_default``   (il_lib optimizer + il_lib capacity)
#     * this config                              (DP optimizer + il_lib capacity)
#   So
#     [DP opt | DP cap]  vs  [DP opt | il cap]   isolates capacity effect.
#     [DP opt | il cap]  vs  [il opt | il cap]   isolates optimizer effect.
#
# Differences vs. ``diffusion_goal_rgb_unet.yaml``:
#   * ``down_dims`` : [512, 1024, 2048] -> [64, 128]
#
# Caveat: the smaller UNet may train faster per step (fewer params) but is
# significantly less expressive. If this run reaches comparable final loss to
# the full-capacity variant, we've over-paid for capacity. If it plateaus
# much higher, capacity matters.

arch_name: diffusion_goal_rgb_unet_small

# ====== Policy specific ======
horizon: 16
num_latest_obs: 2
deployed_action_steps: 8
lr: 1.0e-4
wd: 1.0e-6
bs: 64

# ====== Policy Module ======
module:
  _target_: il_lib.policies.DiffusionPolicy
  prop_dim: 37
  prop_keys:
    - odom/base_velocity
    - qpos/torso
    - qpos/left_arm
    - qpos/left_gripper
    - qpos/right_arm
    - qpos/right_gripper
    - eef/left_pos
    - eef/left_quat
    - eef/right_pos
    - eef/right_quat
  feature_extractors:
    proprioception:
      _target_: il_lib.nn.common.MLP
      input_dim: ${module.prop_dim}
      hidden_dim: 512
      output_dim: 512
      hidden_depth: 2
      add_output_activation: true
    rgb:
      _target_: il_lib.nn.features.MultiviewResNet18
      backbone: resnet18_gn
      views:
        - robot_r1::robot_r1:zed_link:Camera:0
        - robot_r1::goal::Camera:0
      resnet_output_dim: 512
      token_dim: 512
      use_shared_backbone: true
      load_pretrained: true
      include_depth: false
      enable_random_crop: false
      random_crop_size: 224
      return_last_spatial_map: false
  feature_fusion_hidden_depth: 2
  feature_fusion_hidden_dim: 512
  feature_fusion_output_dim: 512
  feature_fusion_activation: "relu"
  feature_fusion_add_input_activation: false
  feature_fusion_add_output_activation: true
  action_dim: 23
  action_keys: ${robot.action_keys}
  action_key_dims: ${robot.action_key_dims}
  num_latest_obs: ${num_latest_obs}
  backbone:
    _target_: il_lib.nn.diffusion.ConditionalUnet1D
    input_dim: ${module.action_dim}
    local_cond_dim: null
    global_cond_dim: ${eval:'${module.feature_fusion_output_dim} * ${num_latest_obs}'}
    diffusion_step_embed_dim: 128
    # il_lib default (much smaller than DP's canonical [512, 1024, 2048])
    down_dims: [64, 128]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: true
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon
  noise_scheduler_step_kwargs: null
  num_denoise_steps_per_inference: 16
  horizon: ${horizon}
  deployed_action_steps: ${deployed_action_steps}
  optimizer: adamw

data:
  use_action_chunks: false
  visual_obs_types: [rgb]
  use_task_info: false
