# @package _global_
#
# Observation-history variant of ``diffusion_goal_rgb_unet.yaml`` (see that file
# for the full recipe rationale): same recipe, but num_latest_obs=8 frames
# (~0.7s at the dataset's 10Hz) instead of 2. Capped at 8 by the constraint
# num_latest_obs <= horizon - deployed_action_steps + 1 = 9. Keep in sync with
# the baseline if it changes.

arch_name: diffusion_goal_rgb_unet_history

# ====== Policy specific ======
horizon: 16
num_latest_obs: 8
deployed_action_steps: 8
lr: 1.0e-4
wd: 1.0e-6
bs: 64

# ====== Policy Module ======
module:
  _target_: il_lib.policies.DiffusionPolicy
  prop_dim: 37
  prop_keys:
    - odom/base_velocity
    - qpos/torso
    - qpos/left_arm
    - qpos/left_gripper
    - qpos/right_arm
    - qpos/right_gripper
    - eef/left_pos
    - eef/left_quat
    - eef/right_pos
    - eef/right_quat
  # ====== Feature Extractors ======
  feature_extractors:
    proprioception:
      _target_: il_lib.nn.common.MLP
      input_dim: ${module.prop_dim}
      hidden_dim: 512
      output_dim: 512
      hidden_depth: 2
      add_output_activation: true
    rgb:
      _target_: il_lib.nn.features.MultiviewResNet18
      backbone: resnet18_gn
      # Two views: head camera (current obs) + goal image (per-episode
      # reference). Wrist cameras are intentionally dropped to match the
      # ACT-goal pipeline. The goal view key must match
      # ``goal_view_name`` from ``base_config_goal_image.yaml``.
      views:
        - robot_r1::robot_r1:zed_link:Camera:0
        - robot_r1::goal::Camera:0
      resnet_output_dim: 512
      token_dim: 512
      use_shared_backbone: true
      load_pretrained: true
      include_depth: false
      # Static goal reference image should not be randomly cropped per sample;
      # matches ACT-goal convention. Re-enable per-view if augmentation on the
      # head camera turns out to matter.
      enable_random_crop: false
      random_crop_size: 224
      return_last_spatial_map: false
  # ====== Feature Fusion ======
  feature_fusion_hidden_depth: 2
  feature_fusion_hidden_dim: 512
  feature_fusion_output_dim: 512
  feature_fusion_activation: "relu"
  feature_fusion_add_input_activation: false
  feature_fusion_add_output_activation: true
  # ====== Action ======
  action_dim: 23
  action_keys: ${robot.action_keys}
  action_key_dims: ${robot.action_key_dims}
  num_latest_obs: ${num_latest_obs}
  # ====== Backbone ======
  backbone:
    _target_: il_lib.nn.diffusion.ConditionalUnet1D
    input_dim: ${module.action_dim}
    local_cond_dim: null
    global_cond_dim: ${eval:'${module.feature_fusion_output_dim} * ${num_latest_obs}'}
    diffusion_step_embed_dim: 128
    # Canonical DP UNet capacity (vs il_lib default ``[64, 128]``). The
    # smaller default is significantly under-parameterised for the 23-dim
    # action chunk and goal-conditioned multi-view inputs.
    down_dims: [512, 1024, 2048]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: true
  # ====== Diffusion ======
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon # or sample
  noise_scheduler_step_kwargs: null
  # DDIM lets us run inference in 16 steps instead of the 100 used at
  # training; matches il_lib's existing diffusion configs and is the standard
  # speedup over DDPM.
  num_denoise_steps_per_inference: 16
  horizon: ${horizon}
  deployed_action_steps: ${deployed_action_steps}
  # Canonical DP uses AdamW (with betas=[0.95, 0.999]). il_lib's
  # ``DiffusionPolicy`` supports ``adam`` and ``adamw``; pick ``adamw`` to
  # match DP. Betas are not exposed as a config kwarg.
  optimizer: adamw
  # ====== EMA ======
  # Canonical DP averages the policy weights via EMA and uses the averaged
  # copy for all inference. Without this, validation loss is much noisier
  # and final deployment performance is worse. Defaults below match the
  # DP UNet image workspace recipe
  # (``diffusion_policy-main/.../train_diffusion_unet_image_workspace.yaml``).
  use_ema: true
  ema_power: 0.75
  ema_update_after_step: 0
  ema_inv_gamma: 1.0
  ema_min_value: 0.0
  ema_max_value: 0.9999

data:
  use_action_chunks: false
  # RGB-only to match the goal-image pipeline.
  visual_obs_types: [rgb]
  use_task_info: false
