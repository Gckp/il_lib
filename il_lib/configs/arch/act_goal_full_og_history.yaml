# @package _global_
#
# Observation-history variant of ``act_goal_full_og.yaml``.
#
# Identical to ``act_goal_full_og.yaml`` in every respect EXCEPT it feeds the
# policy a short window of the most recent observation frames instead of a
# single frame. This is the history counterpart used for ablating "does
# temporal context help?" against the single-frame ``act_goal_full_og``
# baseline -- keep the two files in sync if the baseline recipe changes.
#
# What ``num_latest_obs`` does for ACT (see ``il_lib.policies.ACT.forward``):
#   * proprio: the L most-recent proprio vectors are flattened into a single
#     transformer token of dim ``prop_dim * num_latest_obs``.
#   * vision : each of the L frames is encoded by the (shared) ResNet and folded
#     into the token/width axis, so the transformer attends over L frames worth
#     of spatial tokens per view.
# No change to the action chunk: ``num_queries``/``horizon`` still control the
# predicted action sequence, so unlike diffusion there is no horizon-vs-history
# length constraint here.
#
# ``num_latest_obs: 4`` ~= 0.4s of context at the 30 Hz control rate. Override
# on the CLI to sweep the history length.

arch_name: act_goal_full_og_history

# ====== Policy specific ======
num_latest_obs: 4
horizon: 60
deployed_action_steps: 1  # change to ${horizon} if temporal ensemble is off
lr: 1.0e-5
wd: 1.0e-4
bs: 8

# ------ module ------
module:
  _target_: il_lib.policies.ACT
  prop_dim: 37
  prop_keys:
    - odom/base_velocity
    - qpos/torso
    - qpos/left_arm
    - qpos/left_gripper
    - qpos/right_arm
    - qpos/right_gripper
    - eef/left_pos
    - eef/left_quat
    - eef/right_pos
    - eef/right_quat
  action_dim: 23
  action_keys: ${robot.action_keys}
  use_proprio: true
  features: [proprioception, rgb]
  obs_backbone:
    _target_: il_lib.nn.features.MultiviewResNet18
    backbone: resnet18
    views:
      - robot_r1::robot_r1:zed_link:Camera:0
      - robot_r1::goal::Camera:0
    resnet_output_dim: 512
    use_shared_backbone: true
    load_pretrained: true
    include_depth: false
    enable_random_crop: false
    random_crop_size: 224
    return_last_spatial_map: true
    use_frozen_batch_norm: true
  pos_encoding:
    position_embedding: sine
    hidden_dim: ${module.hidden_dim}
  num_queries: ${horizon}
  # Observation history: fold the L most-recent frames into proprio/vision
  # tokens (see header). Wired from the top-level ``num_latest_obs``.
  num_latest_obs: ${num_latest_obs}
  hidden_dim: 512
  dropout: 0.1
  n_heads: 8
  dim_feedforward: 3200
  num_encoder_layers: 4
  num_decoder_layers: 7
  pre_norm: false
  kl_weight: 10
  temporal_ensemble: true
  lr_backbone: 1.0e-5

data:
  use_action_chunks: false
  visual_obs_types: [rgb]
  use_task_info: false
