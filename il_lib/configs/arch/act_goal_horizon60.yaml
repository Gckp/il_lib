# @package _global_
#
# ACT baseline with goal-image conditioning, chunk horizon matched to
# canonical ACT in real-time terms.
#
# Hypothesis tested:
#   Short chunks (``horizon=20`` = 0.67 s @ 30 Hz) limit how much temporal
#   structure the decoder learns to encode per query, possibly biasing it
#   toward an open-loop "memorise the mean trajectory" solution. Canonical ACT
#   uses chunk=100 @ 50 Hz (= 2.0 s); the matching value at 30 Hz is 60.
#   Extending the chunk gives the decoder a richer per-step loss signal and a
#   longer temporal context to attribute to specific obs features.
#
# Differences vs. ``arch/act_goal.yaml``:
#   * ``horizon`` : 20 -> 60
#     (propagates to ``module.num_queries`` via ``${horizon}``)
#
# Note: ``deployed_action_steps=1`` is preserved (temporal ensembling re-queries
# the policy every step), so the eval-time closed-loop behaviour is unchanged
# and the sensitivity probe remains directly comparable to the baseline.
#
# Expected read on the sensitivity probe:
#   * If action-distance under goal_swap / head_swap becomes non-zero ->
#     chunk length was a meaningful bottleneck and we can sweep horizon
#     {40, 60, 80} to find the knee. (Counter to the prior; would update beliefs
#     about long chunks favouring mean-prediction.)
#   * If still bit-zero -> chunk length is not what's keeping the decoder from
#     learning to use obs.

arch_name: act_goal_horizon60

# ====== Policy specific ======
num_latest_obs: 1
horizon: 60
deployed_action_steps: 1  # change to ${horizon} if temporal ensemble is off
wd: 0.1
bs: 128

# ------ module ------
module:
  _target_: il_lib.policies.ACT
  prop_dim: 37
  prop_keys:
    - odom/base_velocity
    - qpos/torso
    - qpos/left_arm
    - qpos/left_gripper
    - qpos/right_arm
    - qpos/right_gripper
    - eef/left_pos
    - eef/left_quat
    - eef/right_pos
    - eef/right_quat
  action_dim: 23
  action_keys: ${robot.action_keys}
  use_proprio: true
  features: [proprioception, rgb]
  obs_backbone:
    _target_: il_lib.nn.features.MultiviewResNet18
    backbone: resnet18
    views:
      - robot_r1::robot_r1:zed_link:Camera:0
      - robot_r1::goal::Camera:0
    resnet_output_dim: 512
    use_shared_backbone: true
    load_pretrained: true
    include_depth: false
    enable_random_crop: false
    random_crop_size: 224
    return_last_spatial_map: true
    use_frozen_batch_norm: true
  pos_encoding:
    position_embedding: sine
    hidden_dim: ${module.hidden_dim}
  num_queries: ${horizon}
  hidden_dim: 512
  dropout: 0.1
  n_heads: 8
  dim_feedforward: 3200
  num_encoder_layers: 4
  num_decoder_layers: 7
  pre_norm: false
  kl_weight: 10
  temporal_ensemble: true
  lr_backbone: 1.0e-5

data:
  use_action_chunks: false
  visual_obs_types: [rgb]
  use_task_info: false
